[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "envseed"
version = "0.1.0"
description = "Scan source files for os.getenv() calls and generate .env.example files."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
keywords = ["env", "dotenv", "scanner"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Repository = "https://github.com/felixhartmannnn/envseed"
Homepage = "https://github.com/felixhartmannnn/envseed"

[project.scripts]
envseed = "envseed.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["envseed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py38"
